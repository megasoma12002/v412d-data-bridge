name: Complete Telecom and 0050 OHLCV
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  fetch-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 yfinance==0.2.65
      - name: Fetch and QC
        run: python scripts/fetch_telecom_0050_ohlcv.py
      - name: Persist completed data
        run: |
          mkdir -p data/telecom_0050_complete
          cp out_telecom_0050/* data/telecom_0050_complete/
          git config user.name "ohlcv-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telecom_0050_complete
          git diff --cached --quiet || git commit -m "data: complete telecom and 0050 OHLCV"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: telecom-0050-complete-ohlcv
          path: out_telecom_0050/
          retention-days: 30
