name: Complete Telecom and 0050 OHLCV
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fetch-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 requests==2.32.3 yfinance==0.2.65
      - name: Fetch and QC with diagnostics
        run: python scripts/fetch_telecom_0050_ohlcv.py
      - name: Persist completed data and diagnostics
        if: always()
        run: |
          mkdir -p data/telecom_0050_complete
          cp -f out_telecom_0050/* data/telecom_0050_complete/ || true
          git config user.name "ohlcv-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telecom_0050_complete
          git diff --cached --quiet || git commit -m "data: complete telecom and 0050 OHLCV"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telecom-0050-complete-ohlcv
          path: out_telecom_0050/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce QC gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("out_telecom_0050/qc_summary.json")
          assert p.exists(), "qc_summary.json was not produced"
          q=json.loads(p.read_text())
          assert q.get("overall_pass"), json.dumps(q, indent=2)
          PY
