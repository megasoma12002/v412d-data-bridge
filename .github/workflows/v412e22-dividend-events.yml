name: V4.12-E22 Dividend Events Bridge

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # Phase 5 — weekday refresh before Taipei close forward (v412f @ 30 8 UTC ≈ 16:30).
    # 07:00 UTC ≈ 15:00 Asia/Taipei Mon–Fri.
    - cron: "0 7 * * 1-5"
  push:
    paths:
      - scripts/v412e22_fetch_dividend_events.py
      - ".github/workflows/v412e22-dividend-events.yml"

permissions:
  contents: write

concurrency:
  group: v412e22-dividend-events
  cancel-in-progress: false

jobs:
  fetch:
    # Issue triggers only for repository owner + title prefix (public-repo hardening).
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, 'RUN_E22') &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Free+token = 600 req/hr (vs 300 without). Shared with E50 FinMind jobs.
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -e .
      - name: Fetch E21 dividend and rights events
        run: python scripts/v412e22_fetch_dividend_events.py
      - name: Commit event ledger (fetch-only; no Soft-Frozen / forward rewrite)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend_events
          if git diff --cached --quiet; then
            echo "No dividend event ledger changes"
            exit 0
          fi
          git commit -m "data: refresh E22 dividend event ledger"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: v412e22-dividend-events
          path: data/dividend_events
          retention-days: 90
