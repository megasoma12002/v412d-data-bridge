name: PR Paper Hygiene

# Lightweight fail-closed checks for research/script PRs.
# Avoids depending on workflow_dispatch (requires actions:write; Cloud Agent tokens often lack it).

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "research/**"
      - "repro/**"
      - "pyproject.toml"
      - "setup.py"
      - "Dockerfile"
      - ".github/workflows/pr-paper-hygiene.yml"
      - ".github/workflows/e21-live-qc-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "research/**"
      - "repro/**"
      - "pyproject.toml"
      - "setup.py"
      - "Dockerfile"
      - ".github/workflows/pr-paper-hygiene.yml"

concurrency:
  group: pr-paper-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (editable; no PYTHONPATH)
        run: pip install --disable-pip-version-check -e .
      - name: E45 paper hygiene
        run: python3 scripts/check_e45_paper_hygiene.py
      - name: Project coding hygiene
        run: python3 scripts/check_project_coding_hygiene.py
      - name: Landmine unit guards
        run: python3 -m unittest tests.test_landmine_guards tests.test_live_modularize tests.test_pyproject_layout tests.test_dual_paper_month_end -v
      - name: Month-end freshness + E22 repair unit tests
        run: python3 -m unittest tests.test_ops_month_end_data_freshness tests.test_e22_dividend_amount_repair -v
