name: Ops Month-End Paper Pack

# Cadence pack for L4 / FIN50 / Track A monitors + live↔paper recon + data freshness.
# RESEARCH / OPS only. Never Soft-Frozen flip. Never auto cutover.
# Does not auto-fetch E22 dividends (use v412e22-dividend-events on-demand).

on:
  workflow_dispatch:
    inputs:
      refresh_ledgers:
        description: "Formal month-end: rebuild dual-paper ledgers before monitors (slow; recommended)"
        type: boolean
        default: true
      continue_on_error:
        description: "Continue remaining steps after a failure"
        type: boolean
        default: false
      fail_on_stale:
        description: "Fail when hard freshness checks fail (market tip / E22 age / shadow fail)"
        type: boolean
        default: true
  # Monthly reminder (UTC). Cron always refreshes ledgers + fails on stale.
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on the 1st (~17:00 Asia/Taipei)

concurrency:
  group: ops-month-end-paper-pack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  month-end-paper-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check numpy pandas
      - name: Run month-end paper pack
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_INPUT: ${{ inputs.refresh_ledgers }}
          CONT_INPUT: ${{ inputs.continue_on_error }}
          STALE_INPUT: ${{ inputs.fail_on_stale }}
        run: |
          set -euo pipefail
          args=()
          # Cron = formal month-end: always refresh ledgers + fail on stale.
          # Dispatch: honor inputs (defaults: refresh=true, fail_on_stale=true).
          if [ "${EVENT_NAME}" = "schedule" ]; then
            args+=(--refresh-ledgers --fail-on-stale)
          else
            if [ "${REFRESH_INPUT}" = "true" ]; then args+=(--refresh-ledgers); fi
            if [ "${STALE_INPUT}" = "true" ]; then args+=(--fail-on-stale); fi
          fi
          if [ "${CONT_INPUT}" = "true" ]; then args+=(--continue-on-error); fi
          echo "Running: python3 scripts/ops_month_end_paper_pack.py ${args[*]:-}"
          python3 scripts/ops_month_end_paper_pack.py ${args[@]+"${args[@]}"}
      - name: Upload ops summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-month-end-paper-pack-${{ github.run_number }}
          path: |
            research/ops/MONTH_END_PAPER_PACK.md
            research/ops/MONTH_END_PAPER_PACK.json
            research/ops/MONTH_END_DATA_FRESHNESS.md
            research/ops/MONTH_END_DATA_FRESHNESS.json
            research/ops/LIVE_PAPER_RECON.md
            research/ops/LIVE_PAPER_RECON.json
            research/ops/OPS_ALERTS.md
            research/ops/OPS_ALERTS.json
            research/ops/E22_DATA_QUALITY_KPI.md
            research/ops/E22_DATA_QUALITY_KPI.json
            research/gaps/L4_DD_PATH_MONTH_END_MONITOR.md
            research/gaps/L4_DD_PATH_MONTH_END_MONITOR.json
            research/gaps/FIN_CAP_50_MONTH_END_MONITOR.md
            research/gaps/FIN_CAP_50_MONTH_END_MONITOR.json
            research/e50a/TRACK_A_S9A1_MONITOR_STATUS.md
            research/e50a/TRACK_A_S9A1_MONITOR_STATUS.json
          retention-days: 90
          if-no-files-found: warn
      - name: Annotate freshness + alerts
        if: always()
        run: |
          set -euo pipefail
          echo "### Data freshness" >> "$GITHUB_STEP_SUMMARY"
          if [ -f research/ops/MONTH_END_DATA_FRESHNESS.md ]; then
            cat research/ops/MONTH_END_DATA_FRESHNESS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MONTH_END_DATA_FRESHNESS.md missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Month-end ops alerts" >> "$GITHUB_STEP_SUMMARY"
          if [ -f research/ops/OPS_ALERTS.md ]; then
            cat research/ops/OPS_ALERTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OPS_ALERTS.md missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### E22 data-quality KPI" >> "$GITHUB_STEP_SUMMARY"
          if [ -f research/ops/E22_DATA_QUALITY_KPI.md ]; then
            cat research/ops/E22_DATA_QUALITY_KPI.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit monitor refreshes (no Soft-Frozen / no forward rewrite policy)
        # Refuse partial commits when continue_on_error was used (incomplete pack risk).
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.continue_on_error != true)
        run: |
          set -euo pipefail
          git config user.name "ops-month-end-bot"
          git config user.email "actions@users.noreply.github.com"
          # Paper/ops artifacts only — never touch Soft-Frozen source or invent cutover.
          git add \
            research/ops/ \
            research/gaps/L4_DD_PATH_MONTH_END_MONITOR.md \
            research/gaps/L4_DD_PATH_MONTH_END_MONITOR.json \
            research/gaps/FIN_CAP_50_MONTH_END_MONITOR.md \
            research/gaps/FIN_CAP_50_MONTH_END_MONITOR.json \
            research/e50a/TRACK_A_S9A1_MONITOR_STATUS.md \
            research/e50a/TRACK_A_S9A1_MONITOR_STATUS.json \
            repro/l4-dd-path-dual-paper/month_end/ \
            repro/fincap50-dual-paper/month_end/ \
            repro/e50a-dual-track/track_a_s9a1_monitor/ \
            repro/soft-assist-dual-paper-observe/ \
            repro/sleeve-tilt-dual-paper-observe/ \
            repro/fuse-additive-dual-paper-observe/ \
            repro/fin-within-sleeve-dual-paper-observe/ \
            || true
          if git diff --cached --quiet; then
            echo "No monitor artifact changes to commit."
            exit 0
          fi
          git commit -m "ops: month-end paper pack refresh (Soft-Frozen unchanged)"
          git pull --rebase
          git push
