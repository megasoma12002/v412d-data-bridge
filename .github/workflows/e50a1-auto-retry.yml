name: V4.12-E50-A1 Retry Failed Batches

on:
  workflow_run:
    workflows: ["V4.12-E50-A1 Full Backfill"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-once:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun only failed batches once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
