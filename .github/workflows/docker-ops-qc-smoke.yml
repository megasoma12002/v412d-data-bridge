name: Docker ops QC smoke

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/ops_docker_qc_smoke.sh"
      - "pyproject.toml"
      - "setup.py"
      - "scripts/live_config.py"
      - "scripts/e21_qc.py"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/ops_docker_qc_smoke.sh"
      - "pyproject.toml"
      - "setup.py"

permissions:
  contents: read

jobs:
  docker-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + QC smoke
        run: bash scripts/ops_docker_qc_smoke.sh
