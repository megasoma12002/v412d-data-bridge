name: E21 Live QC Smoke

# Fail-closed Exact T+1 QC on existing forward/e21 tree.
# Does NOT rebuild market data, does NOT flip Soft-Frozen, does NOT cutover.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/e21_qc.py"
      - "scripts/e21_forward_pipeline.py"
      - "scripts/e16_soft_frozen_base.py"
      - "scripts/ops_alert_scan.py"
      - "scripts/e22_gap6_fidelity_kpi.py"
      - "forward/e21/**"
      - ".github/workflows/e21-live-qc-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/e21_qc.py"
      - "scripts/e21_forward_pipeline.py"
      - "scripts/e16_soft_frozen_base.py"
      - "scripts/ops_alert_scan.py"
      - "scripts/e22_gap6_fidelity_kpi.py"
      - "forward/e21/**"
      - ".github/workflows/e21-live-qc-smoke.yml"

concurrency:
  group: e21-live-qc-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-qc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pandas
      - name: Fail-closed E21 QC (canonical forward/e21)
        run: python3 scripts/e21_qc.py --state-dir forward/e21
      - name: Show qc_status.json (Exact T+1 fields)
        if: always()
        run: |
          set -euo pipefail
          test -f forward/e21/qc_status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path("forward/e21/qc_status.json").read_text())
          keep = {k: q.get(k) for k in ("status", "exact_t1_ok", "same_bar_fills", "fills_checked", "live_wire")}
          print(json.dumps(keep, indent=2))
          if q.get("status") == "PASS":
              assert q.get("exact_t1_ok") is True
          else:
              raise SystemExit("QC status FAIL")
          PY
      - name: E22 Gap #6 fidelity KPI (fail-closed on code wire)
        if: always()
        run: |
          set -euo pipefail
          set +e
          python3 scripts/e22_gap6_fidelity_kpi.py
          rc=$?
          set -e
          echo "### E22 Gap #6 fidelity" >> "$GITHUB_STEP_SUMMARY"
          if [ -f research/ops/E22_GAP6_FIDELITY_KPI.md ]; then
            cat research/ops/E22_GAP6_FIDELITY_KPI.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          k = json.loads(Path("research/ops/E22_GAP6_FIDELITY_KPI.json").read_text())
          print(json.dumps({
              "code_ok": k.get("code_ok"),
              "live_evidence_ok": k.get("live_evidence_ok"),
              "kpi_ok": k.get("kpi_ok"),
              "ci_smoke_ok": k.get("ci_smoke_ok"),
              "flags": k.get("flags"),
          }, indent=2))
          # Fail-closed: code wire must be green (no soft-OR greenwash).
          if not k.get("code_ok") or not k.get("ci_smoke_ok"):
              raise SystemExit("Gap-6 code wire FAILED")
          if not k.get("live_evidence_ok"):
              print(
                  "NOTE: kpi_ok=false — live e22_* fields pending next forward run "
                  "(do not rewrite history). Ops debt, not code-wire fail."
              )
          PY
          # rc 1 = code fail (already asserted); rc 2 = evidence debt (allowed for smoke).
          if [ "$rc" -eq 1 ]; then
            exit 1
          fi
      - name: Ops alert scan (fail on CRITICAL)
        if: always()
        run: |
          set -euo pipefail
          # Run after Gap-6 so OPS_ALERTS reflects fresh kpi_ok / live-evidence flags.
          python3 scripts/ops_alert_scan.py --fail-on critical
          echo "### Ops alerts" >> "$GITHUB_STEP_SUMMARY"
          if [ -f research/ops/OPS_ALERTS.md ]; then
            cat research/ops/OPS_ALERTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload OPS_ALERTS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e21-live-qc-alerts-${{ github.run_number }}
          path: |
            research/ops/OPS_ALERTS.md
            research/ops/OPS_ALERTS.json
            research/ops/E22_GAP6_FIDELITY_KPI.md
            research/ops/E22_GAP6_FIDELITY_KPI.json
            forward/e21/qc_status.json
          retention-days: 30
          if-no-files-found: warn
