name: V4.12-E50-A1 Causal Data Layer

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Zero-based offset in the E50-A0 historical alpha-code list"
        required: true
        default: "0"
      limit:
        description: "Codes in this resumable batch (80 x 7 <= 600 requests)"
        required: true
        default: "80"
  push:
    branches: [main]
    paths:
      - ".github/workflows/e50a1-causal-layer.yml"
      - "scripts/e50a1_build_causal_layer.py"
      - "research/e50a1/**"

permissions:
  contents: read

jobs:
  build-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 numpy==2.1.3
      - name: Build causal data batch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/e50a1_build_causal_layer.py \
              --codes-file research/e50a1/alpha_candidate_codes.txt \
              --offset "${{ inputs.offset }}" --limit "${{ inputs.limit }}" \
              --throttle-seconds 6.2 --out e50a1_data
          else
            python scripts/e50a1_build_causal_layer.py \
              --codes 1101,1301,2002,2303,2317,2330,2412,2454,2603,2880,2881,2882,2891,2892,4904 \
              --throttle-seconds 0.2 --out e50a1_data
          fi
      - name: Enforce causal QC
        run: |
          python - <<'PY'
          import json
          q=json.load(open('e50a1_data/qc_status.json'))
          assert q['status']=='PASS', q
          assert q['financial_lookahead_violations']==0, q
          assert q['revenue_lookahead_violations']==0, q
          assert q['nonpositive_share_multipliers']==0, q
          assert q['failed_requests']==0, q
          print(json.dumps(q,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v412-e50a1-causal-${{ github.run_number }}
          path: e50a1_data/
          if-no-files-found: error
          retention-days: 90
